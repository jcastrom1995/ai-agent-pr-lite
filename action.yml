name: "AI PR Agent Lite"
description: "Parses PR body for file/patch blocks, applies changes to the PR branch, and comments results."
author: "AI PR Agent Lite"

inputs:
  git-user-name:
    description: "Git username for commits"
    default: "ai-pr-agent-lite"
  git-user-email:
    description: "Git email for commits"
    default: "ai-pr-agent@users.noreply.github.com"
  commit-message:
    description: "Commit message when applying changes"
    default: "chore(ai-pr-agent): apply PR body changes"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: "20"

    - name: Install deps
      shell: bash
      run: npm ci

    - name: Build bundle
      shell: bash
      run: npm run build

    - name: Run action
      shell: bash
      env:
        INPUT_GIT_USER_NAME: ${{ inputs.git-user-name }}
        INPUT_GIT_USER_EMAIL: ${{ inputs.git-user-email }}
        INPUT_COMMIT_MESSAGE: ${{ inputs.commit-message }}
        GITHUB_TOKEN: ${{ github.token }}
      run: node dist/index.js
