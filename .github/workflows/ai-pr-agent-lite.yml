name: AI PR Agent Lite

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Verify action files exist
        run: |
          echo "Workspace: $(pwd)"
          ls -la
          test -f action.yml && echo "✔ Found action.yml" || (echo "✘ action.yml missing" && exit 1)
          test -f dist/index.js && echo "✔ Found dist/index.js" || (echo "✘ dist/index.js missing (debes commitearlo)" && exit 1)

      - name: Run AI PR Agent Lite (local)
        uses: ./
        with:
          git-user-name: "ai-pr-agent-lite"
          git-user-email: "ai-pr-agent@users.noreply.github.com"
          commit-message: "chore(ai-pr-agent): apply PR body changes"
