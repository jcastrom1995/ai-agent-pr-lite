# .github/actions/ai-pr-agent-lite.yml
name: AI PR Agent Lite

on:
  pull_request:
    types: [opened, edited, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-pr-body:
    runs-on: ubuntu-latest
    steps:
      - name: Run AI PR Agent Lite (local)
        uses: ./.github/actions/ai-pr-agent-lite
        with:
          git-user-name: "ai-pr-agent-lite"
          git-user-email: "ai-pr-agent@users.noreply.github.com"
          commit-message: "chore(ai-pr-agent): apply PR body changes"
